name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Expand initial website source package
        if: hashFiles('nlp-lab-website.zip') != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          excluded = {'.git', '.github', 'node_modules', '.astro', 'dist'}
          with ZipFile('nlp-lab-website.zip') as archive:
              for item in archive.infolist():
                  parts = Path(item.filename).parts
                  if item.is_dir() or not parts or parts[0] != 'nlp-lab-website':
                      continue
                  relative = parts[1:]
                  if not relative or relative[0] in excluded or '..' in relative:
                      continue
                  target = Path(*relative)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(item))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm nlp-lab-website.zip
          git add .
          git commit -m 'Expand website source for editing and deployment'
          git push
      - name: Resolve Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Install, check, build and upload
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@11.25.0
          build-cmd: pnpm check && pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          ASTRO_TELEMETRY_DISABLED: '1'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
